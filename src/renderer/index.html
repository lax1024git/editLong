<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>EditLong</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="toolbox.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-new" class="tb-btn" type="button" title="新建 (Ctrl+N)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#fff" stroke="#4a6fa5" d="M3.5 1.5h6.2L12.5 4.3V14.5h-9z"/>
          <path fill="#dbe7f5" stroke="#4a6fa5" d="M9.5 1.5v3h3"/>
          <path fill="none" stroke="#7a9cc6" d="M5 8h6M5 10.5h6M5 13h4"/>
        </svg>
      </button>
      <button id="btn-open" class="tb-btn" type="button" title="打开 (Ctrl+O)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#f2c94c" stroke="#c48a12" d="M1.5 4.5h4.2l1.3 1.5H14.5v7.5H1.5z"/>
          <path fill="#f8e59a" stroke="#c48a12" d="M1.5 7.5h13v6H1.5z"/>
        </svg>
      </button>
      <button id="btn-save" class="tb-btn" type="button" title="保存 (Ctrl+S)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#3b6ea5" stroke="#234a73" d="M2.5 1.5h10.2L14.5 3.8V14.5h-12z"/>
          <rect fill="#d9ecff" x="4.2" y="1.5" width="7.6" height="6.2"/>
          <rect fill="#f4c542" x="4.5" y="9.2" width="7" height="5.3"/>
          <rect fill="#2b2b2b" x="9.2" y="2.2" width="1.6" height="3.2"/>
        </svg>
      </button>
      <button id="btn-save-as" class="tb-btn" type="button" title="另存为 (Ctrl+Shift+S)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#3b6ea5" stroke="#234a73" d="M1.5 2.5h8.2L11.5 4.5v9H1.5z"/>
          <rect fill="#d9ecff" x="3" y="2.5" width="6" height="4.5"/>
          <rect fill="#f4c542" x="3.2" y="8.5" width="5.6" height="4.5"/>
          <path fill="#2f7d32" stroke="#1b5e20" d="M10 9.2l5 1.3-3.4 3.5-1.7-1z"/>
          <path fill="#cfd8dc" d="M10.3 10.1l3.4 1-2.4 2.4-1.2-.7z"/>
        </svg>
      </button>
      <button id="btn-close" class="tb-btn" type="button" title="关闭 (Ctrl+W)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#fff" stroke="#4a6fa5" d="M2.5 1.5h7L12.5 4.5V14.5h-10z"/>
          <path fill="#dbe7f5" stroke="#4a6fa5" d="M9.5 1.5v3h3"/>
          <path stroke="#c62828" stroke-width="1.6" d="M5.2 7.2l5.6 5.6M10.8 7.2l-5.6 5.6"/>
        </svg>
      </button>
      <span class="tb-split"></span>
      <button id="btn-cut" class="tb-btn" type="button" title="剪切 (Ctrl+X)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle fill="none" stroke="#c62828" cx="4.2" cy="12" r="2.2"/>
          <circle fill="none" stroke="#c62828" cx="11.8" cy="12" r="2.2"/>
          <path fill="none" stroke="#455a64" d="M5.6 10.4L12.5 2.5M10.4 10.4L3.5 2.5"/>
        </svg>
      </button>
      <button id="btn-copy" class="tb-btn" type="button" title="复制 (Ctrl+C)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect fill="#fff" stroke="#546e7a" x="4.5" y="1.5" width="8" height="10"/>
          <rect fill="#eceff1" stroke="#546e7a" x="2.5" y="4.5" width="8" height="10"/>
        </svg>
      </button>
      <button id="btn-paste" class="tb-btn" type="button" title="粘贴 (Ctrl+V)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect fill="#fff" stroke="#546e7a" x="3.5" y="3.5" width="9" height="11"/>
          <rect fill="#90caf9" stroke="#1565c0" x="5.5" y="1.5" width="5" height="3.2" rx="0.6"/>
          <path fill="none" stroke="#90a4ae" d="M5.5 8h5M5.5 10h5M5.5 12h3"/>
        </svg>
      </button>
      <button id="btn-undo" class="tb-btn" type="button" title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="none" stroke="#1565c0" stroke-width="1.6" d="M12.5 11.5a5 5 0 1 0-4.7-7"/>
          <path fill="#1565c0" d="M3 2.2l.2 5.2 5-2.2z"/>
        </svg>
      </button>
      <button id="btn-redo" class="tb-btn" type="button" title="重做 (Ctrl+Y)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="none" stroke="#2e7d32" stroke-width="1.6" d="M3.5 11.5a5 5 0 1 1 4.7-7"/>
          <path fill="#2e7d32" d="M13 2.2l-.2 5.2-5-2.2z"/>
        </svg>
      </button>
      <span class="tb-split"></span>
      <button id="btn-find" class="tb-btn" type="button" title="查找 (Ctrl+F)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle fill="none" stroke="#455a64" cx="5.2" cy="6.2" r="3.2"/>
          <circle fill="none" stroke="#455a64" cx="10.2" cy="6.2" r="3.2"/>
          <path fill="none" stroke="#455a64" d="M3.2 8.6c.7 1.6 1.9 2.6 3.3 2.6s2.6-1 3.3-2.6"/>
          <path fill="none" stroke="#6d4c41" stroke-width="1.5" d="M8 9.8v4.3"/>
          <path fill="#6d4c41" d="M6.6 13.6h2.8l-.6 1.4h-1.6z"/>
        </svg>
      </button>
      <button id="btn-find-next" class="tb-btn" type="button" title="查找下一个 (F3)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle fill="none" stroke="#455a64" cx="4.6" cy="5.4" r="2.6"/>
          <circle fill="none" stroke="#455a64" cx="8.8" cy="5.4" r="2.6"/>
          <path fill="#1565c0" d="M5.5 11.2h5.2l-2.1 3.2z"/>
        </svg>
      </button>
      <button id="btn-goto" class="tb-btn" type="button" title="转到 (Ctrl+G)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="none" stroke="#546e7a" d="M2.5 3.5h11M2.5 8h11M2.5 12.5h11"/>
          <path fill="#e53935" d="M11.2 1.8l2.6 3.4-2.6 3.4z"/>
        </svg>
      </button>
      <span class="tb-split"></span>
      <button id="btn-text" class="tb-btn mode active" type="button" title="文本窗口 (Ctrl+1)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect fill="#fff" stroke="#1565c0" x="2.5" y="1.5" width="11" height="13"/>
          <path stroke="#1565c0" d="M4.5 5h7M4.5 7.5h7M4.5 10h5"/>
        </svg>
      </button>
      <button id="btn-hex" class="tb-btn mode" type="button" title="二进制 / 十六进制 (Ctrl+2)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect fill="#e8f5e9" stroke="#2e7d32" x="1.5" y="1.5" width="13" height="13"/>
          <path fill="#2e7d32" d="M3 3.2h1.4v4H3zm2.2 0h1.1v4H5.2zM9.4 3.2h1.4v4H9.4zm2.2 0h.5v4h-.5zm.9 0h.5v4h-.5z"/>
          <path fill="#1b5e20" d="M3 9.2h1.4v4H3zm2.2 0h.5v4h-.5zm.9 0h.5v4h-.5zM9.4 9.2h1.4v4H9.4zm2.2 0h1.4v4h-1.4z"/>
        </svg>
      </button>
      <span class="tb-split"></span>
      <button id="btn-toolbox" class="tb-btn" type="button" title="快捷工具箱">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect fill="#f9a825" stroke="#c67c00" x="1.5" y="6.2" width="13" height="8.3" rx="1"/>
          <path fill="#ffd54f" stroke="#c67c00" d="M5 6.2V4.2c0-1.3 1.3-2.2 3-2.2s3 .9 3 2.2v2"/>
          <rect fill="#6d4c41" x="7.1" y="9" width="1.8" height="2.4" rx="0.4"/>
        </svg>
      </button>
      <button id="btn-record" class="tb-btn" type="button" title="区域录屏 (Ctrl+Shift+R)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle fill="#e53935" cx="8" cy="8" r="5.2"/>
          <circle fill="#ffcdd2" cx="8" cy="8" r="2.1"/>
        </svg>
      </button>
      <button id="btn-snip" class="tb-btn" type="button" title="区域截图">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect fill="none" stroke="#6a1b9a" stroke-dasharray="2 1.5" x="1.5" y="2.5" width="13" height="10"/>
          <path fill="#8e24aa" d="M9.2 8.2l4.6 5.3H6.2z"/>
          <circle fill="#fdd835" stroke="#f9a825" cx="5.2" cy="6" r="1.5"/>
        </svg>
      </button>
      <label class="enc">
        编码
        <select id="encoding"></select>
      </label>
    </header>

    <nav id="tabbar" class="tabbar hidden" aria-label="打开的文件">
      <div id="tabstrip"></div>
    </nav>

    <section id="find-bar" class="find-bar hidden">
      <input id="find-input" type="text" placeholder="查找内容或十六进制字节" />
      <label><input id="find-hex" type="checkbox" /> 十六进制</label>
      <label><input id="find-case" type="checkbox" /> 区分大小写</label>
      <button id="find-prev" type="button">上一个</button>
      <button id="find-next" type="button">下一个</button>
      <button id="find-close" class="icon" type="button" title="关闭">×</button>
    </section>

    <section id="goto-bar" class="find-bar hidden">
      <span>转到</span>
      <input id="goto-input" type="text" placeholder="行号，或 0x 偏移" />
      <button id="goto-go" type="button">跳转</button>
      <button id="goto-close" class="icon" type="button">×</button>
    </section>

    <main id="stage">
      <div id="welcome" class="welcome">
        <h1>EditLong</h1>
        <p>类似记事本的大文件编辑器：按窗口读取，不把整个文件装进内存。</p>
        <ul>
          <li>Ctrl+O 打开文本或二进制文件（可多选，每个文件一个标签）</li>
          <li>Ctrl+2 切换十六进制窗口</li>
          <li>Ctrl+F 搜索文本或字节序列</li>
        </ul>
      </div>

      <div id="text-edit" class="pane hidden">
        <textarea id="editor" spellcheck="false" wrap="off"></textarea>
      </div>

      <div id="text-view" class="pane hidden">
        <div id="text-gutter" class="gutter"></div>
        <div id="text-body" class="body"></div>
      </div>

      <div id="hex-view" class="pane hidden">
        <div id="hex-body" class="body hex"></div>
      </div>

      <div id="vscroll" class="vscroll hidden">
        <div id="vthumb"></div>
      </div>
    </main>

    <footer id="status">
      <span id="st-file">未打开文件</span>
      <span id="st-pos">Ln 1, Col 1</span>
      <span id="st-off">偏移 0</span>
      <span id="st-size"></span>
      <span id="st-lang">纯文本</span>
      <span id="st-mode">文本</span>
      <span id="st-zoom" title="Ctrl+滚轮缩放，Ctrl+0 复位">100%</span>
    </footer>
    <div id="tbx-overlay" class="hidden">
      <aside id="tbx-panel">
        <div class="tbx-head">
          快捷工具箱
          <button id="tbx-close" type="button" title="关闭">×</button>
        </div>
        <nav class="tbx-tabs">
          <button class="tbx-tab active" type="button" data-tab="time">时间</button>
          <button class="tbx-tab" type="button" data-tab="json">JSON</button>
          <button class="tbx-tab" type="button" data-tab="image">图片</button>
          <button class="tbx-tab" type="button" data-tab="crypto">加解密</button>
        </nav>
        <div class="tbx-body">
          <section class="tbx-page active" data-page="time">
            <div class="tbx-row">
              <label>时区
                <select id="tbx-tz"></select>
              </label>
              <label>时间戳单位
                <select id="tbx-unit">
                  <option value="s">秒（10 位）</option>
                  <option value="ms">毫秒（13 位）</option>
                </select>
              </label>
            </div>
            <div class="tbx-field">
              时间戳
              <div class="inline">
                <input id="tbx-ts" type="text" />
                <button id="tbx-copy-ts" type="button">复制</button>
              </div>
            </div>
            <div class="tbx-field">
              日期时间（YYYY-MM-DD HH:mm:ss）
              <div class="inline">
                <input id="tbx-dt" type="text" />
                <button id="tbx-copy-dt" type="button">复制</button>
              </div>
            </div>
            <div class="tbx-actions">
              <button id="tbx-ts2dt" type="button">时间戳 → 时间</button>
              <button id="tbx-dt2ts" type="button">时间 → 时间戳</button>
              <button id="tbx-now" type="button">现在</button>
            </div>
            <div id="tbx-time-msg" class="tbx-msg"></div>
          </section>

          <section class="tbx-page" data-page="json">
            <div class="tbx-actions">
              <button id="tbx-json-format" type="button">校验 / 格式化</button>
              <button id="tbx-json-minify" type="button">压缩</button>
              <button id="tbx-json-escape" type="button">转义</button>
              <button id="tbx-json-unescape" type="button">去转义</button>
              <button id="tbx-json-u2c" type="button">Unicode 转中文</button>
              <button id="tbx-json-c2u" type="button">中文转 Unicode</button>
              <button id="tbx-json-copy" type="button">复制</button>
              <button id="tbx-json-clear" type="button">清空</button>
            </div>
            <textarea id="tbx-json" placeholder="粘贴 JSON / JSONC"></textarea>
            <div id="tbx-json-msg" class="tbx-msg"></div>
          </section>

          <section class="tbx-page" data-page="image">
            <div id="tbx-img-drop" class="img-drop">点击或拖入图片（可多张）JPG / PNG / WebP / GIF / BMP</div>
            <input id="tbx-img-file" type="file" accept="image/*" multiple hidden />
            <div id="tbx-img-list" class="img-list"></div>
            <div class="tbx-row">
              <label>输出格式
                <select id="tbx-img-format">
                  <option value="jpeg">JPEG</option>
                  <option value="png">PNG</option>
                  <option value="webp">WebP</option>
                </select>
              </label>
              <label>压缩质量（JPEG/WebP）
                <input id="tbx-img-quality" type="number" min="10" max="100" value="80" />
              </label>
            </div>
            <div class="size-opts">
              <label class="inline"><input type="radio" name="tbx-size-mode" value="orig" checked /> 保持原尺寸</label>
              <label class="inline">
                <input type="radio" name="tbx-size-mode" value="max" /> 限制最大宽高
                <input id="tbx-max-w" type="number" placeholder="宽" />
                <input id="tbx-max-h" type="number" placeholder="高" />
              </label>
              <label class="inline">
                <input type="radio" name="tbx-size-mode" value="exact" /> 指定宽高
                <input id="tbx-exact-w" type="number" placeholder="宽" />
                <input id="tbx-exact-h" type="number" placeholder="高" />
                <label><input id="tbx-keep-ratio" type="checkbox" checked /> 保持宽高比</label>
              </label>
              <label class="inline">
                <input type="radio" name="tbx-size-mode" value="pct" /> 按比例缩放
                <input id="tbx-scale" type="number" min="5" max="200" value="100" /> %
              </label>
            </div>
            <div class="tbx-actions">
              <button id="tbx-img-run" type="button">批量转换</button>
              <button id="tbx-img-clear" type="button">清空列表</button>
            </div>
            <div id="tbx-img-msg" class="tbx-msg"></div>
          </section>

          <section class="tbx-page" data-page="crypto">
            <div class="crypto-grid">
              <div class="crypto-col">
                <span>明文</span>
                <textarea id="tbx-plain"></textarea>
                <div class="tbx-side-actions">
                  <button id="tbx-copy-plain" type="button">复制</button>
                </div>
              </div>
              <div class="tbx-mid">
                <label>算法
                  <select id="tbx-crypto-mode">
                    <option value="aes">AES加密/解密</option>
                    <option value="des">DES加密/解密</option>
                    <option value="md5">MD5</option>
                    <option value="base64">Base64加/解密</option>
                    <option value="hash">Hash</option>
                  </select>
                </label>
                <label>密钥
                  <input id="tbx-crypto-key" type="text" placeholder="可选，可留空" />
                </label>
                <label>Hash 算法
                  <select id="tbx-hash-algo">
                    <option value="sha256">SHA-256</option>
                    <option value="sha1">SHA-1</option>
                    <option value="sha512">SHA-512</option>
                  </select>
                </label>
                <button id="tbx-encrypt" type="button">加密 →</button>
                <button id="tbx-decrypt" type="button">← 解密</button>
                <button id="tbx-crypto-swap" type="button">交换</button>
                <button id="tbx-crypto-clear" type="button">清空</button>
              </div>
              <div class="crypto-col">
                <span>密文 / 摘要</span>
                <textarea id="tbx-cipher"></textarea>
                <div class="tbx-side-actions">
                  <button id="tbx-copy-cipher" type="button">复制</button>
                </div>
              </div>
            </div>
            <div id="tbx-crypto-msg" class="tbx-msg"></div>
          </section>
        </div>
      </aside>
    </div>
    <div id="hotkey-overlay" class="hidden">
      <div id="hotkey-box">
        <h3>截图快捷键</h3>
        <p>点击输入框后按下组合键。全局生效，应用在后台也能截图。</p>
        <input id="hotkey-input" type="text" readonly placeholder="按下组合键" />
        <div id="hotkey-msg" class="tbx-msg"></div>
        <div class="tbx-actions">
          <button id="hotkey-save" type="button">保存</button>
          <button id="hotkey-default" type="button">恢复默认</button>
          <button id="hotkey-close" type="button">关闭</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
    <script src="toolbox.js"></script>
  </body>
</html>
